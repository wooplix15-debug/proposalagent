[project]
name = "wooplix-proposal-agent"
version = "0.1.0"
description = "Source-grounded proposal and BRD generation with LangGraph"
requires-python = ">=3.12,<3.15"
# Keep in sync with requirements.txt for local pip installations.
dependencies = [
    "groq>=0.11.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api.index:app"
